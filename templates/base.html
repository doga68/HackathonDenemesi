<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hekate | İş Platformu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>form input:not([type=checkbox]), form select, form textarea {display:block;width:100%;margin-bottom:.5rem;padding:.4rem}
  form p{margin-bottom:.8rem} .helptext{display:block;font-size:.8rem;color:#777}</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4"><div class="container">
  <a class="navbar-brand" href="{% url 'home' %}">Hekate</a>
  <div class="navbar-nav ms-auto align-items-center">
  {% if user.is_authenticated %}
    {% if user.profile.role == 'hr' %}
      <a class="nav-link" href="{% url 'hr_dashboard' %}">Panelim</a>
      <a class="nav-link" href="{% url 'job_create' %}">Yeni ilan</a>
    {% elif user.profile.role == 'seeker' %}
      <a class="nav-link" href="{% url 'job_list' %}">İlanlar</a>
      <a class="nav-link" href="{% url 'my_applications' %}">Başvurularım</a>
      <a class="nav-link" href="{% url 'profile' %}">Profilim</a>
    {% endif %}
    <form method="post" action="{% url 'logout' %}" class="ms-2">{% csrf_token %}<button class="btn btn-sm btn-outline-light">Çıkış</button></form>
  {% else %}
    <a class="nav-link" href="{% url 'login' %}">Giriş</a>
  {% endif %}
  </div></div></nav>
<div class="container pb-5">
  {% for m in messages %}<div class="alert alert-success">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</div></body></html>
