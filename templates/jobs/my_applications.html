{% extends 'base.html' %}
{% block content %}
<h3>Başvurularım</h3>
<table class="table bg-white"><tr><th>Pozisyon</th><th>Tarih</th><th>Durum</th></tr>
{% for a in apps %}<tr><td>{{ a.job.title }}</td><td>{{ a.created_at|date:"d.m.Y" }}</td><td>{{ a.get_status_display }}</td></tr>
{% empty %}<tr><td colspan="3">Henüz başvurunuz yok.</td></tr>{% endfor %}</table>
{% endblock %}
